name: Prepare annual report

# Runs (1) when the website asks for a company that has no processed report yet (the Cloudflare Worker starts it),
# and (2) every night to pick up newly published annual reports.
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Stock symbol as used on the site, e.g. AAPL or RELIANCE.NS"
        required: true
        type: string
      force:
        description: "Rebuild even if the report looks up to date"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 21 * * *"   # 03:00 IST every day

permissions:
  contents: write   # commit data/reports/*.json
  pages: write      # ask GitHub Pages to rebuild so the new file is served quickly

# one run per company (different companies can run side by side); the nightly refresh has its own lane
concurrency:
  group: report-${{ github.event_name == 'schedule' && 'nightly-refresh' || inputs.symbol }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Find, read and index the annual report
        env:
          EVENT: ${{ github.event_name }}
          SYMBOL: ${{ inputs.symbol }}
          FORCE: ${{ inputs.force }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            python scripts/prepare_report.py --refresh
          elif [ "$FORCE" = "true" ]; then
            python scripts/prepare_report.py --symbol "$SYMBOL" --force
          else
            python scripts/prepare_report.py --symbol "$SYMBOL"
          fi

      - name: Commit the result
        env:
          BRANCH: ${{ github.ref_name }}
          SYMBOL: ${{ inputs.symbol }}
        run: |
          git config user.name  "plutus-report-bot"
          git config user.email "plutus-report-bot@users.noreply.github.com"
          git add data/reports
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "reports: update ${SYMBOL:-nightly refresh}"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            sleep $(( RANDOM % 12 + 4 ))
          done
          echo "could not push after several attempts" >&2
          exit 1

      - name: Ask GitHub Pages to rebuild (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
